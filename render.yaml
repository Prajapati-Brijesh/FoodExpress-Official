services:
  # Backend (Django + MongoDB)
  - type: web
    name: food-express-api
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn food.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MONGODB_URI
        sync: false # IMPORTANT: Set this in Render Dashboard (e.g. MongoDB Atlas URI)
    rootDirectory: food

  # Frontend (Vite)
  - type: static
    name: food-express-ui
    runtime: node
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://food-express-api.onrender.com # Change this if your service name differs
    rootDirectory: Food Uber
